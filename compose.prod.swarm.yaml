version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: BackendTestProject
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network
    secrets:
      - mysql_root_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    image: fastapi-ecom-backend:latest
    working_dir: /app
    environment:
      - HOME=/tmp
      - PYTHONPATH=/app
    command: >
      sh -c "
      export HOME=/tmp &&
      export DATABASE_URL=$$(cat /run/secrets/database_url) &&
      export DATABASE_SYNC_URL=$$(cat /run/secrets/database_sync_url) &&
      export SECRET_KEY=$$(cat /run/secrets/secret_key) &&
      export ALGORITHM=$$(cat /run/secrets/algorithm) &&
      export ACCESS_TOKEN_EXPIRE_MINUTES=$$(cat /run/secrets/access_token_expire_minutes) &&
      export API_AUTH_KEY=$$(cat /run/secrets/api_auth_key) &&
      export CELERY_BROKER_URL=$$(cat /run/secrets/celery_broker_url) &&
      export CELERY_RESULT_BACKEND=$$(cat /run/secrets/celery_result_backend) &&
      exec gunicorn --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 testbackmain:app --access-logfile /tmp/log.txt
      "
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    secrets:
      - database_url
      - database_sync_url
      - secret_key
      - algorithm
      - access_token_expire_minutes
      - api_auth_key
      - celery_broker_url
      - celery_result_backend
      - gunicorn_workers
    networks:
      - app-network
    deploy:
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis-queue:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    deploy:
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    image: fastapi-ecom-backend:latest
    environment:
      - HOME=/tmp
    command: >
      sh -c "
      export HOME=/tmp &&
      export DATABASE_URL=$$(cat /run/secrets/database_url) &&
      export DATABASE_SYNC_URL=$$(cat /run/secrets/database_sync_url) &&
      export SECRET_KEY=$$(cat /run/secrets/secret_key) &&
      export ALGORITHM=$$(cat /run/secrets/algorithm) &&
      export ACCESS_TOKEN_EXPIRE_MINUTES=$$(cat /run/secrets/access_token_expire_minutes) &&
      export API_AUTH_KEY=$$(cat /run/secrets/api_auth_key) &&
      export CELERY_BROKER_URL=$$(cat /run/secrets/celery_broker_url) &&
      export CELERY_RESULT_BACKEND=$$(cat /run/secrets/celery_result_backend) &&
      exec celery -A worker.celery_app worker -I tasks --loglevel=info
      "  
    volumes:
      - ./:/app
    networks:
      - app-network
    secrets:
      - database_url
      - database_sync_url
      - secret_key
      - algorithm
      - access_token_expire_minutes
      - api_auth_key
      - celery_broker_url
      - celery_result_backend
      - gunicorn_workers
    deploy:
      restart_policy:
        condition: on-failure

  migrate:
    image: fastapi-ecom-backend:latest
    environment:
      - HOME=/tmp
    command: >
      sh -c "
      export HOME=/tmp &&
      export DATABASE_URL=$$(cat /run/secrets/database_sync_url) &&
      exec alembic upgrade head
      "
    networks:
      - app-network
    secrets:
      - database_sync_url
    deploy:
      restart_policy:
        condition: none


secrets:
  database_url:
    external: true
  database_sync_url:
    external: true
  secret_key:
    external: true
  algorithm:
    external: true
  access_token_expire_minutes:
    external: true
  api_auth_key:
    external: true
  celery_broker_url:
    external: true
  celery_result_backend:
    external: true
  mysql_root_password:
    external: true
  mysql_database:
    external: true
  gunicorn_workers:
    external: true

volumes:
  db_data:
  redis_data:

networks:
  app-network:
    driver: overlay